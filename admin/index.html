<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAR Agro Soluciones · Panel de Administración</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; background: #0C2E14; }
    #loading {
      position: fixed; inset: 0; background: #0C2E14;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: white; gap: 16px; z-index: 9999;
    }
    #loading .logo { font-size: 48px; }
    #loading p { font-size: 14px; color: rgba(255,255,255,0.5); letter-spacing: 2px; text-transform: uppercase; }
    #loading .spinner {
      width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #E05818; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo">🍊</div>
    <div class="spinner"></div>
    <p>Cargando panel de administración...</p>
  </div>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Hide loading screen once CMS is ready
    window.addEventListener('load', () => {
      setTimeout(() => {
        const el = document.getElementById('loading');
        if (el) el.style.display = 'none';
      }, 2000);
    });
  </script>
</body>
</html>
