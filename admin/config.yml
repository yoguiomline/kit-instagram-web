backend:
  name: git-gateway
  branch: main

media_folder: "assets/logos"
public_folder: "/assets/logos"

locale: "es"

collections:
  - name: "sitio"
    label: "⚙️ Contenido del sitio"
    files:
      - name: "general"
        label: "📝 Textos y datos generales"
        file: "data/site.json"
        format: json
        fields:
          - label: "Nombre de la empresa"
            name: "empresa"
            widget: "string"
          - label: "Tagline principal (banner)"
            name: "tagline"
            widget: "string"
            hint: "Ej: Del campo a tu cosecha."
          - label: "Subtítulo del banner"
            name: "subtitulo"
            widget: "string"
          - label: "Descripción del banner"
            name: "descripcion_banner"
            widget: "text"
          - label: "Título del hero"
            name: "hero_titulo"
            widget: "string"
          - label: "Descripción del hero"
            name: "hero_descripcion"
            widget: "text"

          - label: "── CONTACTO ──"
            name: "contacto_header"
            widget: "hidden"
            default: ""

          - label: "Teléfono (visible)"
            name: "telefono"
            widget: "string"
            hint: "Ej: 3456 417626"
          - label: "WhatsApp (solo números con código de país)"
            name: "whatsapp"
            widget: "string"
            hint: "Ej: 543456417626"
          - label: "Email"
            name: "email"
            widget: "string"
          - label: "Instagram (sin @)"
            name: "instagram"
            widget: "string"
            hint: "Ej: mar_agrosoluciones"
          - label: "Ubicación"
            name: "ubicacion"
            widget: "string"
          - label: "Horario de atención"
            name: "horario"
            widget: "string"

          - label: "── ESTADÍSTICAS ──"
            name: "stats_header"
            widget: "hidden"
            default: ""

          - label: "Años de experiencia"
            name: "anos_experiencia"
            widget: "number"
          - label: "Cantidad de marcas"
            name: "cantidad_marcas"
            widget: "number"

          - label: "── SECCIÓN NOSOTROS ──"
            name: "nos_header"
            widget: "hidden"
            default: ""

          - label: "Párrafo 1"
            name: "nosotros_p1"
            widget: "text"
          - label: "Párrafo 2"
            name: "nosotros_p2"
            widget: "text"
          - label: "Párrafo 3"
            name: "nosotros_p3"
            widget: "text"

          - label: "Frase de la familia (sección equipo)"
            name: "frase_familia"
            widget: "text"

          - label: "── EQUIPO ──"
            name: "equipo_header"
            widget: "hidden"
            default: ""

          - label: "Equipo"
            name: "equipo"
            widget: "list"
            summary: "{{fields.nombre}} — {{fields.rol}}"
            fields:
              - label: "Iniciales (máx. 2 letras)"
                name: "iniciales"
                widget: "string"
              - label: "Nombre completo"
                name: "nombre"
                widget: "string"
              - label: "Cargo / Rol"
                name: "rol"
                widget: "string"
              - label: "Descripción"
                name: "bio"
                widget: "text"
              - label: "Tipo"
                name: "tipo"
                widget: "select"
                options:
                  - label: "Familia Repetto"
                    value: "familia"
                  - label: "Miembro del equipo"
                    value: "equipo"

          - label: "── SERVICIOS ──"
            name: "srv_header"
            widget: "hidden"
            default: ""

          - label: "Servicios"
            name: "servicios"
            widget: "list"
            summary: "{{fields.nombre}}"
            fields:
              - label: "Ícono (emoji)"
                name: "icono"
                widget: "string"
              - label: "Nombre del servicio"
                name: "nombre"
                widget: "string"
              - label: "Descripción"
                name: "descripcion"
                widget: "text"

          - label: "── MARCAS ──"
            name: "marcas_header"
            widget: "hidden"
            default: ""

          - label: "Marcas"
            name: "marcas"
            widget: "list"
            summary: "{{fields.nombre}}"
            hint: "Agregá cada marca con su nombre y logo en PNG o JPG"
            fields:
              - label: "Nombre de la marca"
                name: "nombre"
                widget: "string"
                hint: "Ej: Bayer, Rizobacter, YPF Agro"
              - label: "Logo de la marca"
                name: "logo"
                widget: "image"
                hint: "Subí el logo en PNG o JPG. Fondo transparente recomendado."
                allow_multiple: false